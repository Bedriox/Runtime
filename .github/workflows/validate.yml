name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository metadata and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use PHP 8.4 for repository tooling
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # Node.js 24 revision
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Check shell syntax
        shell: bash
        run: |
          bash -n compile.sh
          find scripts/unix -type f -name '*.sh' -print0 | sort -z | xargs -0 -r -n1 bash -n

      - name: Validate repository metadata
        run: php tools/validate.php
